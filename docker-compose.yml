version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pokemon-postgres
    environment:
      POSTGRES_DB: pokemondb
      POSTGRES_USER: pokemon
      POSTGRES_PASSWORD: pokemon123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  pokemon:
    build:
      context: ./apirest-pokemon
      dockerfile: Dockerfile
    container_name: spring-pokemon
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_USER: pokemon
      DB_PASSWORD: pokemon123
    depends_on:
      - postgres
    networks:
      - app-network

  frontend:
    build:
      context: ./my-react-app
      dockerfile: Dockerfile
    container_name: react-pokemon
    ports:
      - "3000:3000"
    depends_on:
      - pokemon
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - pokemon
      - frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
