spring.application.name=PokemonAPIRest

# El puerto lo define Render via variable de entorno PORT
server.port=${PORT:8080}

# PostgreSQL - Render provee DATABASE_URL (internal) que ya viene en formato correcto
# Para la URL interna de Render, usar JDBC_DATABASE_URL
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT - Usar variable de entorno segura en produccion
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS - Permitir el frontend
cors.allowed-origins=${CORS_ORIGINS:https://pokemon.andy-jhoao.com}
