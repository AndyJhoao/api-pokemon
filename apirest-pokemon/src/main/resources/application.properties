spring.application.name=PokemonAPIRest
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/pokemondb
spring.datasource.username=${DB_USER:pokemon}
spring.datasource.password=${DB_PASSWORD:pokemon123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:superSecretKeyForPokemonAppThatIsAtLeast256BitsLong!}
jwt.expiration=86400000
